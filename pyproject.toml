[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clock-tui"
version = "1.2.0"
description = "Dashboard TUI en curses: reloj, clima, alarmas, timers, cronómetro, tareas y configuración."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
clock = "clock_tui.main:main"
clock-tui = "clock_tui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clock_tui = ["sounds/*.ogg", "sounds/*.oga", "sounds/*.mp3", "sounds/*.wav"]
